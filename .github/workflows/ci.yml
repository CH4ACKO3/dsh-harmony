name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22.22.3, 24.11.1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm pack --dry-run --workspace dsh-harmony-react
      - run: npm version --no-git-tag-version "0.0.0-ci.${{ github.run_id }}.${{ github.run_attempt }}"
      - run: npm publish --dry-run --tag ci
